<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Sonix AI - Professional AI Music Generator with Vocals & Instrumental">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/logo-512.png">
    <link rel="apple-touch-icon" href="/assets/logo-512.png">
    
    <style>
        #loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #0a0a0f; }
        .spinner { width: 48px; height: 48px; border: 3px solid #2a2a3a; border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        body:not(.loaded) #app { display: none !important; }
    </style>
    <title>Sonix AI Music Generator</title>
</head>
<body class="bg-[#0a0a0f] text-white antialiased">
    <div id="loader"><div class="spinner"></div></div>
    <div id="app"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-[10000] flex flex-col gap-2 pointer-events-none"></div>
    <div id="modal-container" class="fixed inset-0 z-[10001] hidden"></div>
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/components.css">
    <script type="module" src="/js/app.js"></script>
</body>
</html>
